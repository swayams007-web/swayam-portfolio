<style>
/* Layout: video-first editorial portfolio. Thumbnails only, no text around videos. */
:root{--ink:#0e0e0f;--char:#1a1a1c;--char2:#232326;--line:#2c2c30;--bone:#edeae3;--ash:#8a8a8e;--pop:#9aa5ff;

--gut:clamp(16px,3.2vw,40px);--g:clamp(8px,1.2vw,16px);--sec:clamp(48px,6vw,88px);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
body{background:var(--ink);color:var(--bone);font:400 16px/1.6 var(--body);margin:0;-webkit-font-smoothing:antialiased;

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
h1,h2,h3,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pop);outline-offset:3px}
.wrap{max-width:1560px;margin:0 auto;padding-inline:max(var(--gut),env(safe-area-inset-left,0px)) max(var(--gut),env(safe-area-inset-right,0px))}
.display{font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.88;text-transform:uppercase}

nav{position:fixed;z-index:50;top:env(safe-area-inset-top,0px);left:0;right:0;background:rgba(14,14,15,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px;gap:16px}
nav a{text-decoration:none;font-size:.95rem;white-space:nowrap;padding:10px 2px}
nav a:hover{color:var(--pop)}
.brand{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:1.05rem}
.links{display:flex;gap:clamp(14px,2.6vw,34px)}
.links .long{display:inline}.links .short{display:none}
@media(max-width:640px){.links .long{display:none}.links .short{display:inline}.brand{font-size:.95rem}.links{gap:14px}nav a{font-size:.88rem}}

main{padding-top:calc(60px + env(safe-area-inset-top,0px))}
/* tiles */
.rows{display:flex;flex-wrap:wrap;gap:var(--g);justify-content:center}
.tile{position:relative;flex:0 0 calc((100% - (var(--c,3) - 1) * var(--g)) / var(--c,3));aspect-ratio:9/16;overflow:hidden;border:0;padding:0;border-radius:3px;background:#000;display:block}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile img{transition:transform .6s cubic-bezier(.22,1,.36,1)}
.tile video{opacity:0;transition:opacity .3s}
.tile.on video{opacity:1}
.tile .pl{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(14,14,15,.55);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;transition:opacity .25s}
.tile .pl svg{width:18px;height:18px;fill:var(--bone);margin-left:2px}
@media(hover:hover){.tile:hover img{transform:scale(1.04)}.tile:hover .pl{opacity:1}.tile.on .pl{opacity:0}}
/* sections */
.sec{padding-top:var(--sec)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:clamp(20px,3vw,36px)}
.h2{font-size:clamp(2.4rem,6.4vw,5.6rem)}
.more{font-size:1rem;text-decoration:none;border-bottom:1px solid var(--bone);padding-bottom:3px;white-space:nowrap}
.more:hover{color:var(--pop);border-color:var(--pop)}
/* hero */
.hero{display:grid;gap:clamp(20px,3vw,40px);padding-top:clamp(20px,3vw,40px)}
.hero .hv{width:min(100%,calc((100svh - 7.5rem) * 9 / 16))}
.hero .hv .tile{width:100%;flex:none}
.role{color:var(--ash);font-size:clamp(1rem,1.6vw,1.2rem)}
.hero h1{margin-top:clamp(10px,1.5vw,20px);font-size:clamp(3.4rem,17vw,8rem)}
.statement h2{font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1.02;font-size:clamp(1.9rem,3.6vw,3.4rem);max-width:15ch}
.statement p{color:var(--ash);margin-top:16px;max-width:42ch;font-size:1.02rem}
.statement .more{display:inline-block;margin-top:24px}
@media(min-width:1024px){
 .hero{grid-template-columns:minmax(0,1fr) auto;align-items:center;min-height:calc(100svh - 7rem);column-gap:clamp(28px,3vw,48px)}

 .hero .hl{grid-column:1;grid-row:1;align-self:end}

}
@media(max-width:1023px){.hero .hv{justify-self:center}.hero .statement{order:3}}

.pl-close svg,.pl-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.pl-nav{display:flex;gap:12px}
.pl-nav button{width:48px;height:48px;border-radius:50%;background:rgba(14,14,15,.75);border:1px solid rgba(237,234,227,.4);display:grid;place-items:center}
.pl-nav button:hover{border-color:var(--pop);color:var(--pop)}

 .pl-vid{width:min(92vw,calc((100svh - 6rem) * 9 / 16))}
 .pl-nav{position:fixed;inset:50% 0 auto;justify-content:space-between;padding-inline:max(28px,3vw);pointer-events:none;transform:translateY(-50%)}
 .pl-nav button{pointer-events:auto}
}
.pl-vid{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;outline-offset:3px}
.pl-vid video{pointer-events:none}
.pl-pp{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(14,14,15,.62);border:1px solid rgba(237,234,227,.5);display:grid;place-items:center;opacity:0;transition:opacity .2s;pointer-events:none}

.pl-msg{position:absolute;inset:auto 0 0;background:rgba(14,14,15,.92);padding:14px 16px;font-size:.9rem;color:var(--bone);text-align:center}

.pnote[hidden]{display:none}
</style>
